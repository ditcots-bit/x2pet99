<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Quản Lý Gem Pet99</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .admin-container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #f1c40f; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #888; margin-left: 5px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #444; background: #2d2d2d; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #f1c40f; }
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 15px; text-transform: uppercase; }
        .btn-add { background: #2ecc71; color: white; box-shadow: 0 4px #27ae60; }
        .btn-sub { background: #e74c3c; color: white; box-shadow: 0 4px #c0392b; }
        button:active { transform: translateY(2px); box-shadow: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #msg { margin-top: 20px; font-weight: bold; min-height: 24px; padding: 15px; border-radius: 12px; font-size: 14px; }
        .status-loading { color: #f1c40f; border: 1px dashed #f1c40f; }
        .status-success { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }
        .status-error { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid #e74c3c; }
        .nav-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
        .nav-links a { color: #3498db; text-decoration: none; font-size: 14px; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>💎 ADMIN CONTROL 💎</h2>
    
    <div class="input-group">
        <label>Mã bảo mật Admin:</label>
        <input type="password" id="admin-key" placeholder="Nhập mã xác thực...">
    </div>

    <div class="input-group">
        <label>Tên nhân vật (Roblox Name):</label>
        <input type="text" id="target-player" placeholder="Nhập tên chính xác..." autocomplete="off">
    </div>

    <div class="input-group">
        <label>Số lượng Gem:</label>
        <input type="number" id="gem-amount" placeholder="Số lượng muốn thay đổi..." min="1">
    </div>

    <div class="btn-group">
        <button id="btn-add" class="btn-add" onclick="processGem('add')">➕ NẠP GEM</button>
        <button id="btn-sub" class="btn-sub" onclick="processGem('sub')">➖ RÚT GEM</button>
    </div>

    <div id="msg">Sẵn sàng thực hiện lệnh.</div>

    <div class="nav-links">
        <!-- ĐÃ CẬP NHẬT: Thay đổi login.html thành index.html -->
        <a href="index.html">🏠 Về Trang Đăng Nhập</a>
        <a href="giaodien.html">🎮 Vào Sảnh Chơi</a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPffcP5X0EAK5J85Jcfa9UIT7z2Bc-5Q",
        authDomain: "taixiupet99.firebaseapp.com",
        projectId: "taixiupet99",
        storageBucket: "taixiupet99.firebasestorage.app",
        messagingSenderId: "338775305334",
        appId: "1:338775305334:web:f519fcd9e7530873814357",
        databaseURL: "https://taixiupet99-default-rtdb.firebaseio.com" 
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const ADMIN_PASS = "hankukekayo"; // Bạn nhớ đổi mã này cho an toàn

    function processGem(action) {
        const key = document.getElementById('admin-key').value;
        const name = document.getElementById('target-player').value.trim();
        const amount = parseInt(document.getElementById('gem-amount').value);
        const msg = document.getElementById('msg');
        const bAdd = document.getElementById('btn-add');
        const bSub = document.getElementById('btn-sub');

        if (key !== ADMIN_PASS) {
            msg.className = "status-error";
            msg.innerText = "❌ Sai mã bảo mật Admin!";
            return;
        }

        if(!name || isNaN(amount) || amount <= 0) {
            alert("Vui lòng nhập đầy đủ thông tin!");
            return;
        }

        const confirmMsg = action === 'add' ? `Nạp ${amount} Gem cho ${name}?` : `Rút ${amount} Gem của ${name}?`;
        if (!confirm(confirmMsg)) return;

        bAdd.disabled = true;
        bSub.disabled = true;
        msg.className = "status-loading";
        msg.innerText = "⏳ Đang xử lý trên máy chủ...";
        
        const userRef = database.ref('users/' + name);
        
        userRef.once('value').then((snapshot) => {
            let currentGems = 0;
            if (snapshot.exists()) {
                currentGems = snapshot.val().gems || 0;
            } else if (action === 'sub') {
                throw new Error("Người chơi không tồn tại!");
            }

            let newTotal = (action === 'add') ? (currentGems + amount) : Math.max(0, currentGems - amount);

            return userRef.update({ gems: newTotal }).then(() => newTotal);
        }).then((newTotal) => {
            msg.className = "status-success";
            msg.innerHTML = `✅ THÀNH CÔNG!<br><b>${name}</b> hiện có: ${newTotal.toLocaleString()} 💎`;
            document.getElementById('gem-amount').value = ""; 
        }).catch((error) => {
            msg.className = "status-error";
            msg.innerText = `❌ LỖI: ${error.message}`;
        }).finally(() => {
            bAdd.disabled = false;
            bSub.disabled = false;
        });
    }
</script>
</body>
</html>
