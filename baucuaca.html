<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Đếm Thời Gian Server Bầu Cua - ThinhDZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f111a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 40px 20px; }
        .server-box { max-width: 600px; margin: auto; background: #161925; border: 2px solid #1f2336; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .status-badge { font-size: 1.2rem; font-weight: bold; padding: 8px 16px; border-radius: 6px; text-transform: uppercase; display: inline-block; margin-bottom: 20px; }
        .state-SHAKING { background: #e67e22; color: #fff; }
        .state-BETTING { background: #2e7d32; color: #fff; }
        .state-LOCKED { background: #7f8c8d; color: #fff; }
        .state-RESULT { background: #1565c0; color: #fff; }
        .timer-display { font-size: 5rem; font-weight: 900; color: #00ff00; font-family: monospace; margin: 20px 0; }
        .dice-preview img { width: 60px; height: 60px; margin: 5px; border-radius: 8px; background: #fff; padding: 3px; border: 2px solid #ffd700; }
        .log-console { background: #000; color: #00ff00; font-family: monospace; padding: 12px; border-radius: 6px; height: 120px; overflow-y: auto; text-align: left; font-size: 0.85rem; margin-top: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="server-box text-center">
        <h2 class="text-warning mb-4">⚙️ BẦU CUA SERVER HOST</h2>
        <p class="text-secondary">Hãy treo tab này để tự động đếm giây và đồng bộ ván đấu cho tất cả người chơi.</p>
        
        <hr style="border-color: #2c314d;">

        <div id="statusBadge" class="status-badge state-SHAKING">ĐANG KHỞI ĐỘNG...</div>
        
        <div class="text-secondary">Giây hệ thống:</div>
        <div id="countdown" class="timer-display">01</div>

        <div class="mt-3">
            <h5 class="text-info">🎲 Xúc xắc ván này:</h5>
            <div id="dicePreview" class="dice-preview">
                <span class="text-muted">Đang trong phiên cược...</span>
            </div>
        </div>

        <div class="log-console" id="logConsole">
            [SYSTEM]: Máy chủ bầu cua đã sẵn sàng...<br>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCPffcP5X0EAK5J85Jcfa9UIT7z2Bc-5Q",
            authDomain: "taixiupet99.firebaseapp.com",
            projectId: "taixiupet99",
            databaseURL: "https://taixiupet99-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const serverSystemRef = database.ref('baucua_server');
        const roomBetRef = database.ref('baucua_room/bets');
        const liveBetsRef = database.ref('baucua_room/liveBets');

        const linhVat = ['nai', 'bau', 'ga', 'ca', 'cua', 'tom'];
        let giay = 0; 
        let currentDiceResult = [];

        function writeLog(text) {
            const consoleEl = document.getElementById('logConsole');
            const time = new Date().toLocaleTimeString();
            consoleEl.innerHTML += `[${time}] ${text}<br>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        setInterval(() => {
            giay++;
            if (giay > 30) giay = 1; // Vòng lặp chuẩn từ 1 đến 30 giây

            let state = "BETTING";
            let displaySec = giay;

            // Xác định trạng thái chuẩn theo giây chạy xuôi
            if (giay >= 1 && giay <= 2) {
                state = "SHAKING";
                displaySec = giay;
            } else if (giay >= 3 && giay <= 22) {
                state = "BETTING";
                displaySec = 23 - giay; // Hiển thị đếm ngược từ 20 về 1 cho người chơi dễ nhìn
            } else if (giay >= 23 && giay <= 24) {
                state = "LOCKED";
                displaySec = 0;
            } else if (giay >= 25 && giay <= 30) {
                state = "RESULT";
                displaySec = 31 - giay; // Thời gian chờ xem kết quả (Đếm ngược từ 6 về 1)
            }

            // Cập nhật giao diện Admin Server
            const badge = document.getElementById('statusBadge');
            const countdownEl = document.getElementById('countdown');
            countdownEl.innerText = displaySec < 10 ? "0" + displaySec : displaySec;

            badge.className = "status-badge state-" + state;
            if (state === "SHAKING") {
                badge.innerText = "Nhà cái đang xóc đĩa";
                countdownEl.style.color = "#e67e22";
            } else if (state === "BETTING") {
                badge.innerText = "Thời gian đặt cược";
                countdownEl.style.color = "#00ff00";
            } else if (state === "LOCKED") {
                badge.innerText = "Đã khóa cửa cược";
                countdownEl.style.color = "#7f8c8d";
            } else if (state === "RESULT") {
                badge.innerText = "Đang mở bát kết quả";
                countdownEl.style.color = "#33b3ff";
            }

            // --- LOGIC XỬ LÝ DATABASE THEO GIÂY CHUẨN ---

            // Mốc 1: Vừa sang giây thứ 1 ván mới -> Dọn dẹp bàn cược
            if (giay === 1) {
                roomBetRef.set({ nai: 0, bau: 0, ga: 0, ca: 0, cua: 0, tom: 0 });
                liveBetsRef.set(null);
                document.getElementById('dicePreview').innerHTML = `<span class="text-muted">Đang trong phiên cược...</span>`;
                writeLog("🧹 Bắt đầu ván mới. Đã dọn sạch tiền cược phòng.");
            }

            // Mốc 2: Vừa hết thời gian cược (Giây thứ 23) -> Khóa cược công khai và Server lắc kết quả sẵn
            if (giay === 23) {
                let d1 = linhVat[Math.floor(Math.random() * 6)];
                let d2 = linhVat[Math.floor(Math.random() * 6)];
                let d3 = linhVat[Math.floor(Math.random() * 6)];
                currentDiceResult = [d1, d2, d3];

                // Đẩy kết quả và đổi trạng thái sang LOCKED
                serverSystemRef.update({
                    state: "LOCKED",
                    currentSecond: 0,
                    dices: currentDiceResult
                });
                writeLog(`🎲 Server đã chốt xong kết quả: ${d1} - ${d2} - ${d3}`);
            }
            // Mốc 3: Đến giây thứ 25 -> Ra lệnh mở bát, hiển thị xúc xắc cho người chơi xem 5 giây liền
            else if (giay === 25) {
                const previewEl = document.getElementById('dicePreview');
                previewEl.innerHTML = `
                    <img src="img/${currentDiceResult[0]}.png">
                    <img src="img/${currentDiceResult[1]}.png">
                    <img src="img/${currentDiceResult[2]}.png">
                `;
                serverSystemRef.update({
                    state: "RESULT",
                    currentSecond: displaySec
                });
                writeLog(`💥 Đã mở bát công khai kết quả ván đấu!`);
            }
            // Các giây khác chỉ cập nhật số giây bình thường
            else {
                serverSystemRef.update({
                    state: state,
                    currentSecond: displaySec
                });
            }

        }, 1000);
    </script>
</body>
</html>
