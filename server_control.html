<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Điều Hành Tài Xỉu - Pet99 (V3)</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ff00; text-align: center; padding-top: 30px; margin: 0; }
        .server-box { border: 2px solid #00ff00; display: inline-block; padding: 30px; border-radius: 15px; background: #111; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        #clock { font-size: 72px; margin: 20px 0; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .status-tag { font-size: 18px; padding: 5px 15px; border-radius: 5px; background: #333; margin-bottom: 10px; display: inline-block; }
        #dice-info { font-size: 24px; color: #fff; margin: 15px 0; height: 30px; }
        .history-panel { margin-top: 20px; padding: 15px; background: #000; border-radius: 10px; border: 1px solid #333; }
        #history-log { font-size: 20px; letter-spacing: 5px; margin-top: 10px; }
        .info { color: #666; font-size: 13px; margin-top: 20px; }
        .warning { color: #e74c3c; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

<div class="server-box">
    <div class="status-tag">SERVER STATUS: <span id="server-status">RUNNING</span></div>
    <h2>HỆ THỐNG ĐIỀU KHIỂN GAME</h2>
    
    <div id="clock">60s</div>
    
    <div id="dice-info">Đang chờ phiên mới...</div>

    <div class="history-panel">
        <strong>DỮ LIỆU SOI CẦU (LỊCH SỬ):</strong>
        <div id="history-log">Đang tải...</div>
    </div>

    <div class="warning">⚠️ KHÔNG ĐƯỢC ĐÓNG TAB NÀY</div>
    <p class="info">Máy chủ tự động đồng bộ thời gian và kết quả lên Firebase mỗi giây.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Cấu hình Firebase (Giữ nguyên từ dự án của bạn)
    const firebaseConfig = {
        apiKey: "AIzaSyCPffcP5X0EAK5J85Jcfa9UIT7z2Bc-5Q",
        authDomain: "taixiupet99.firebaseapp.com",
        projectId: "taixiupet99",
        storageBucket: "taixiupet99.firebasestorage.app",
        messagingSenderId: "338775305334",
        appId: "1:338775305334:web:f519fcd9e7530873814357",
        databaseURL: "https://taixiupet99-default-rtdb.firebaseio.com" 
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sessionRef = database.ref('gameSession');
    const totalBetRef = database.ref('gameSession/totalBets');
    const historyRef = database.ref('gameHistory');

    let timeLeft = 60; // Thời gian cược 60 giây
    let isResultState = false;

    // VÒNG LẶP CHÍNH CỦA MÁY CHỦ
    setInterval(() => {
        timeLeft--;

        // GIAI ĐOẠN 1: KẾT THÚC PHIÊN CƯỢC -> RA KẾT QUẢ
        if (timeLeft <= 0 && !isResultState) {
            isResultState = true;
            
            // 1. Random xúc xắc
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const d3 = Math.floor(Math.random() * 6) + 1;
            const dice = [d1, d2, d3];
            const total = d1 + d2 + d3;
            
            // 2. Xác định Tài/Xỉu
            let resultText = (total >= 11) ? "Tai" : "Xiu";
            
            // 3. Cập nhật kết quả lên Firebase để người chơi thấy
            sessionRef.update({
                status: "result",
                dice: dice,
                timeLeft: 0,
                sessionId: Date.now() // Mã phiên để đồng bộ
            });

            // 4. LƯU LỊCH SỬ SOI CẦU
            historyRef.push({
                r: resultText,
                t: Date.now()
            });

            // Tự động xóa lịch sử cũ (chỉ giữ 20 ván)
            historyRef.once('value', (snap) => {
                if (snap.numChildren() > 20) {
                    let count = 0;
                    let target = snap.numChildren() - 20;
                    snap.forEach((child) => {
                        if (count < target) {
                            historyRef.child(child.key).remove();
                        }
                        count++;
                    });
                }
            });

            document.getElementById("dice-info").innerText = `KẾT QUẢ: ${d1}-${d2}-${d3} (${resultText})`;
            timeLeft = 10; // Đợi 10 giây để người chơi xem kết quả trước khi sang ván mới
        } 
        
        // GIAI ĐOẠN 2: RESET PHIÊN MỚI
        else if (timeLeft <= 0 && isResultState) {
            isResultState = false;
            timeLeft = 60;
            
            // Reset tiền cược trên server
            totalBetRef.set({ xiu: 0, tai: 0 });
            
            sessionRef.update({
                status: "betting",
                timeLeft: timeLeft,
                dice: [1, 1, 1]
            });
            document.getElementById("dice-info").innerText = "Đang trong phiên cược mới...";
        } 
        
        // GIAI ĐOẠN 3: ĐANG TRONG THỜI GIAN CƯỢC
        else {
            if (!isResultState) {
                sessionRef.update({ timeLeft: timeLeft });
            }
        }

        // Cập nhật giao diện điều khiển
        updateUI();

    }, 1000);

    function updateUI() {
        const clockEl = document.getElementById("clock");
        if (isResultState) {
            clockEl.innerText = "KẾT QUẢ";
            clockEl.style.color = "#e74c3c";
        } else {
            clockEl.innerText = timeLeft + "s";
            clockEl.style.color = "#f1c40f";
        }
    }

    // HIỂN THỊ LOG LỊCH SỬ TRỰC TIẾP TRÊN SERVER
    historyRef.limitToLast(15).on('value', (snapshot) => {
        let logHTML = "";
        snapshot.forEach(child => {
            let data = child.val();
            if (data.r === "Tai") {
                logHTML += '<span style="color:#e74c3c">●</span> ';
            } else {
                logHTML += '<span style="color:#2ecc71">●</span> ';
            }
        });
        document.getElementById("history-log").innerHTML = logHTML || "Chưa có dữ liệu";
    });

</script>

</body>
</html>
