<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sảnh Chơi - Tài Xỉu Pet99</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        .main-wrapper { display: flex; max-width: 1000px; margin: auto; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .game-container { flex: 1; min-width: 350px; max-width: 450px; background: #1e1e1e; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #333; }
        .chat-container { flex: 1; min-width: 300px; max-width: 400px; height: 600px; background: #1e1e1e; border-radius: 25px; display: flex; flex-direction: column; border: 1px solid #333; overflow: hidden; }
        .chat-header { background: #2d2d2d; padding: 15px; font-weight: bold; color: #f1c40f; border-bottom: 1px solid #444; }
        #chat-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; text-align: left; }
        .chat-msg { background: #2d2d2d; padding: 8px 12px; border-radius: 12px; font-size: 14px; max-width: 85%; word-wrap: break-word; }
        .chat-name { color: #2ecc71; font-weight: bold; font-size: 12px; margin-bottom: 3px; }
        .chat-input-area { padding: 15px; background: #262626; display: flex; gap: 10px; }
        #chat-input { flex: 1; background: #121212; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; outline: none; }
        .btn-send { background: #f1c40f; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .header-info { display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .user-tag { color: #2ecc71; font-weight: bold; font-size: 14px; }
        .gem-balance { color: #f1c40f; font-size: 20px; font-weight: bold; }
        .nap-gem-note { background: linear-gradient(45deg, #f39c12, #e67e22); color: #000; padding: 12px; border-radius: 12px; font-weight: 900; margin-bottom: 20px; font-size: 13px; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); text-transform: uppercase; text-align: center;}
        .dice-display { background: #121212; padding: 30px; border-radius: 20px 20px 0 0; font-size: 60px; border: 2px solid #333; border-bottom: none; display: flex; justify-content: center; gap: 10px; }
        .history-container { background: #121212; padding: 10px; border-radius: 0 0 20px 20px; margin-bottom: 20px; display: flex; justify-content: center; gap: 8px; border: 2px solid #333; border-top: 1px solid #444; flex-wrap: wrap; }
        .dot { width: 14px; height: 14px; border-radius: 50%; }
        .dot-tai { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        .dot-xiu { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .bet-input { width: 90%; padding: 15px; border-radius: 10px; background: #2d2d2d; color: #fff; border: 1px solid #444; text-align: center; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        .btn-group { display: flex; gap: 15px; }
        .bet-column { flex: 1; text-align: center;}
        .btn { width: 100%; padding: 12px; font-size: 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: 800; color: white; transition: 0.3s; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .btn-xiu { background: #3498db; box-shadow: 0 4px #2980b9; }
        .btn-tai { background: #e74c3c; box-shadow: 0 4px #c0392b; }
        .btn-subtext { font-size: 11px; display: block; opacity: 0.8; }
        .total-bet-all { font-size: 11px; margin-bottom: 5px; }
        .bet-label { background: #000; padding: 5px; border-radius: 8px; font-size: 13px; color: #f1c40f; margin-top: 5px; }
        .logout-btn { margin-top: 20px; background: none; border: 1px solid #e74c3c; color: #e74c3c; padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        #status-msg { text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="game-container">
        <div class="header-info">
            <div class="user-tag">👤: <span id="player-name">Đang tải...</span></div>
            <div class="gem-balance"><span id="balance">0</span> 💎</div>
        </div>
        <div class="nap-gem-note">✨ NẠP/RÚT GEM JOIN EMTHAIBABY8 ✨</div>
        <input type="number" id="bet-val" class="bet-input" placeholder="Nhập số Gem cược...">
        <div class="dice-display" id="dice-result">🎲 🎲 🎲</div>
        <div class="history-container" id="history-dots"></div>
        <div id="status-msg" style="margin-bottom: 15px;">Đang kết nối...</div>

        <div class="btn-group">
            <div class="bet-column">
                <div class="total-bet-all">Tổng Xỉu: <span id="total-xiu-all">0</span></div>
                <button id="btn-xiu" class="btn btn-xiu" onclick="gamePlay('Xỉu')">XỈU <span class="btn-subtext">(3-10)</span></button>
                <div class="bet-label">Cược: <span id="bet-xiu-val">0</span></div>
            </div>
            <div class="bet-column">
                <div class="total-bet-all">Tổng Tài: <span id="total-tai-all">0</span></div>
                <button id="btn-tai" class="btn btn-tai" onclick="gamePlay('Tài')">TÀI <span class="btn-subtext">(11-18)</span></button>
                <div class="bet-label">Cược: <span id="bet-tai-val">0</span></div>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">🚪 ĐĂNG XUẤT</button>
    </div>

    <div class="chat-container">
        <div class="chat-header">💬 TRÒ CHUYỆN THẾ GIỚI</div>
        <div id="chat-content"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">GỬI</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCPffcP5X0EAK5J85Jcfa9UIT7z2Bc-5Q",
        authDomain: "taixiupet99.firebaseapp.com",
        projectId: "taixiupet99",
        databaseURL: "https://taixiupet99-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sessionRef = database.ref('gameSession');
    const totalBetRef = database.ref('gameSession/totalBets');
    const historyRef = database.ref('gameHistory');
    const chatRef = database.ref('publicChat');

    const playerName = localStorage.getItem("userRoblox") || "Khách";
    document.getElementById("player-name").innerText = playerName;

    let currentGems = 0, betXiu = 0, betTai = 0, canBet = false, hasReset = true;
    const userRef = database.ref('users/' + playerName);
    
    userRef.on('value', snap => {
        currentGems = snap.val()?.gems || 0;
        document.getElementById("balance").innerText = currentGems.toLocaleString();
    });

    totalBetRef.on('value', snap => {
        const d = snap.val();
        document.getElementById("total-xiu-all").innerText = (d?.xiu || 0).toLocaleString();
        document.getElementById("total-tai-all").innerText = (d?.tai || 0).toLocaleString();
    });

    historyRef.limitToLast(18).on('value', snap => {
        const box = document.getElementById("history-dots"); box.innerHTML = "";
        const data = snap.val();
        if (data) Object.values(data).forEach(i => {
            const d = document.createElement("div");
            d.className = (i.r === 'Tai' || i.r === 'Tài') ? "dot dot-tai" : "dot dot-xiu";
            box.appendChild(d);
        });
    });

    sessionRef.on('value', snap => {
        const s = snap.val(); if (!s) return;
        const msg = document.getElementById("status-msg"), dice = document.getElementById("dice-result");
        const btnX = document.getElementById("btn-xiu"), btnT = document.getElementById("btn-tai");

        if (s.status === "betting") {
            if (s.timeLeft > 0) {
                msg.innerHTML = `⏳ Thời gian: <span style="color:#f1c40f">${s.timeLeft}s</span>`;
                canBet = s.timeLeft > 10;
                if (!canBet) {
                    msg.innerHTML = `<span style="color:#e74c3c">🚫 HẾT GIỜ ĐẶT</span>`;
                }
                updateButtonState();
            }

            // Khi bắt đầu phiên mới (Server reset timeLeft về 60)
            if (s.timeLeft >= 59 && !hasReset) {
                betXiu = 0; betTai = 0; hasReset = true;
                document.getElementById("bet-xiu-val").innerText = "0";
                document.getElementById("bet-tai-val").innerText = "0";
                dice.innerText = "🎲 🎲 🎲";
                updateButtonState();
            }
        }
        
        if (s.status === "result") {
            canBet = false;
            btnX.disabled = true; btnT.disabled = true;
            
            const total = s.dice[0] + s.dice[1] + s.dice[2];
            let resultType = (total >= 11) ? "Tài" : "Xỉu";
            dice.innerText = s.dice.join(" ");
            
            // XỬ LÝ TRẢ THƯỞNG BẰNG TRANSACTION
            if (hasReset) {
                let myBetAmount = (betXiu > 0) ? betXiu : (betTai > 0 ? betTai : 0);
                let myChoice = (betXiu > 0) ? "Xỉu" : (betTai > 0 ? "Tài" : "");

                if (myBetAmount > 0 && myChoice !== "") {
                    if (myChoice === resultType) {
                        const winAmount = myBetAmount * 1.9;
                        userRef.child('gems').transaction(current => (current || 0) + winAmount);
                        msg.innerHTML = `<span style="color:#2ecc71">THẮNG: +${winAmount.toLocaleString()} 💎</span>`;
                    } else {
                        msg.innerHTML = `<span style="color:#e74c3c">KẾT QUẢ: ${resultType} (THUA)</span>`;
                    }
                } else {
                    msg.innerHTML = `Kết quả: <b style="color:#f1c40f">${resultType}</b> (${total})`;
                }
                hasReset = false; // Khóa lại cho đến khi có phiên betting mới
                betXiu = 0; betTai = 0;
            }
        }
    });

    function updateButtonState() {
        const btnX = document.getElementById("btn-xiu"), btnT = document.getElementById("btn-tai");
        if (!canBet) {
            btnX.disabled = true; btnT.disabled = true;
            return;
        }
        if (betXiu > 0) { btnX.disabled = false; btnT.disabled = true; }
        else if (betTai > 0) { btnX.disabled = true; btnT.disabled = false; }
        else { btnX.disabled = false; btnT.disabled = false; }
    }

    function gamePlay(choice) {
        if (!canBet) return;
        let val = parseInt(document.getElementById("bet-val").value);
        if (!val || val <= 0 || val > currentGems) return alert("Số tiền không hợp lệ!");

        // Trừ tiền bằng transaction để an toàn tuyệt đối
        userRef.child('gems').transaction(current => {
            if (current >= val) return current - val;
            return; // Hủy nếu không đủ tiền
        }, (error, committed) => {
            if (committed) {
                if (choice === 'Xỉu') {
                    betXiu += val;
                    document.getElementById("bet-xiu-val").innerText = betXiu.toLocaleString();
                } else {
                    betTai += val;
                    document.getElementById("bet-tai-val").innerText = betTai.toLocaleString();
                }
                totalBetRef.child(choice === 'Xỉu' ? 'xiu' : 'tai').transaction(c => (c || 0) + val);
                document.getElementById("bet-val").value = "";
                updateButtonState();
            } else {
                alert("Giao dịch thất bại hoặc bạn không đủ Gem!");
            }
        });
    }

    function sendMessage() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (text === "") return;
        chatRef.push({ name: playerName, msg: text, time: Date.now() });
        input.value = "";
    }

    chatRef.limitToLast(50).on('child_added', snap => {
        const data = snap.val();
        const content = document.getElementById("chat-content");
        const div = document.createElement("div");
        div.className = "chat-msg";
        div.innerHTML = `<div class="chat-name">${data.name}</div><div>${data.msg}</div>`;
        content.appendChild(div);
        content.scrollTop = content.scrollHeight;
    });

    function logout() { localStorage.removeItem("userRoblox"); window.location.href="index.html"; }
</script>
</body>
</html>
